name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 3s --health-retries 20
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: apimarket
          POSTGRES_PASSWORD: apimarket
          POSTGRES_DB: apimarket
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U apimarket" --health-interval 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: go.mod / go.sum are tidy (checked against the Go checksum database)
        run: |
          if [ -s go.sum ]; then
            go mod tidy -diff
          else
            echo "::warning::go.sum is not committed yet; run 'make tidy' and commit go.sum"
            go mod tidy
          fi
          go mod verify

      - name: Format and vet
        run: |
          test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
          go vet ./...

      - name: Migrations and seed apply cleanly
        env:
          PGPASSWORD: apimarket
        run: |
          for f in migrations/postgres/*.sql; do psql -h localhost -U apimarket -d apimarket -v ON_ERROR_STOP=1 -q -f "$f"; done
          # migrations after 0001 must be idempotent: make migrate re-applies them
          for f in $(ls migrations/postgres/*.sql | tail -n +2); do psql -h localhost -U apimarket -d apimarket -v ON_ERROR_STOP=1 -q -f "$f"; done
          psql -h localhost -U apimarket -d apimarket -v ON_ERROR_STOP=1 -q -f deploy/seed/seed.sql
          psql -h localhost -U apimarket -d apimarket -v ON_ERROR_STOP=1 -q -f deploy/seed/real-apis.sql
          psql -h localhost -U apimarket -d apimarket -v ON_ERROR_STOP=1 -q -f deploy/seed/endpoints.sql

      - name: Tests (race detector; adapters tested against the real Postgres and Redis services)
        env:
          REDIS_ADDR: localhost:6379
          TEST_DATABASE_URL: postgres://apimarket:apimarket@localhost:5432/apimarket?sslmode=disable
        run: go test -race -count=1 -coverprofile=coverage.out ./...

      - name: Coverage summary
        run: go tool cover -func=coverage.out | tail -n 1

  images:
    runs-on: ubuntu-latest
    needs: test
    strategy:
      matrix:
        service: [gateway, controlplane, metering, mockprovider]
    steps:
      - uses: actions/checkout@v4
      - name: Build ${{ matrix.service }} image
        run: docker build --build-arg SERVICE=${{ matrix.service }} -t apimarket/${{ matrix.service }}:ci .

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npx next typegen && npx tsc --noEmit
      - name: Unit tests
        run: npm test
      - name: Production build (control plane not reachable, as in the Docker build)
        run: npm run build
        env:
          CONTROL_PLANE_URL: http://127.0.0.1:1

  e2e:
    runs-on: ubuntu-latest
    needs: [test, web]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Start the stack (fresh volumes, seed data)
        run: docker compose -f deploy/docker-compose.yml up -d --build --wait
      - run: npm ci
        working-directory: web
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - name: Playwright
        run: npx playwright test
        working-directory: web
      - name: Service logs on failure
        if: failure()
        run: docker compose -f deploy/docker-compose.yml logs --no-color gateway controlplane web | tail -n 300
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 7
