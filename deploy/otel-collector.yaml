# Local OpenTelemetry Collector. Services will export OTLP here once
# instrumented. To send to SigNoz Cloud (India region), add an otlp exporter
# with your SigNoz ingestion endpoint and key, and add it to the pipelines.
receivers:
  otlp:
    protocols:
      grpc: { endpoint: 0.0.0.0:4317 }
      http: { endpoint: 0.0.0.0:4318 }

processors:
  batch: {}
  # Never ship credentials or customer keys to observability.
  attributes/scrub:
    actions:
      - { key: http.request.header.x-api-key, action: delete }
      - { key: http.request.header.authorization, action: delete }
      - { key: http.request.header.x-provider-key, action: delete }

exporters:
  debug: { verbosity: basic }
  # otlp/signoz:
  #   endpoint: ingest.in.signoz.cloud:443
  #   headers: { signoz-ingestion-key: ${env:SIGNOZ_INGESTION_KEY} }

service:
  pipelines:
    traces:  { receivers: [otlp], processors: [attributes/scrub, batch], exporters: [debug] }
    metrics: { receivers: [otlp], processors: [batch], exporters: [debug] }
    logs:    { receivers: [otlp], processors: [attributes/scrub, batch], exporters: [debug] }
